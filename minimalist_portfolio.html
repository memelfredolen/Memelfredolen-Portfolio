<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | KinabaluFoto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f9f9f9;
      color: #333;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 600;
    }

    nav {
      text-align: center;
      margin-bottom: 3rem;
    }

    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #555;
      font-weight: 500;
    }

    nav a:hover {
      color: #000;
    }

    section h2 {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 1.5rem;
      color: #222;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    footer {
      margin-top: 4rem;
      text-align: center;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <h1>KinabaluFoto</h1>
    <p>Wedding | Event | Corporate | Commercial</p>
  </header>

  <nav>
    <a href="#photo">Photography</a>
    <a href="#video">Videography</a>
    <a href="#contact">Contact</a>
  </nav>

  <section id="photo">
    <h2>Photography</h2>
    <div class="gallery">
      <img src="photo1.jpg" alt="Wedding shoot">
      <img src="photo2.jpg" alt="Event shoot">
      <img src="photo3.jpg" alt="Corporate shoot">
    </div>
  </section>

  <section id="video" style="margin-top: 3rem;">
    <h2>Videography</h2>
    <div class="gallery">
      <img src="thumb1.jpg" alt="Video thumbnail">
      <img src="thumb2.jpg" alt="Video thumbnail">
      <img src="thumb3.jpg" alt="Video thumbnail">
    </div>
  </section>

  <section id="contact" style="margin-top: 3rem; text-align: center;">
    <h2>Contact</h2>
    <p>Email: kinabalufoto@email.com</p>
    <p>Instagram: @kinabalufoto</p>
  </section>

  <footer>
    <p>&copy; 2025 KinabaluFoto. All rights reserved.</p>
  </footer>
</body>
</html>
